<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f97316">
<link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Hjemmebasen – Logg inn</title>
<link rel="stylesheet" href="felles/stil.css">
<style>
.login-wrap{max-width:360px;margin:0 auto;padding:14vh 1rem 2rem}
.logo{text-align:center;margin-bottom:1.4rem}
.logo .emoji{font-size:52px;display:block;margin-bottom:8px}
.logo h1{font-size:20px;font-weight:800}
.logo p{font-size:12px;color:var(--text3);margin-top:3px}
.feil{display:none;font-size:12.5px;color:var(--danger);background:rgba(229,62,62,.08);border:1px solid rgba(229,62,62,.3);border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.4}
.glemt{text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <span class="emoji">🏠</span>
    <h1>Hjemmebasen</h1>
    <p>Familiens apper – samlet på ett sted</p>
  </div>
  <div class="card">
    <p class="feil" id="feil"></p>
    <label for="epost">E-post</label>
    <input class="hinput" id="epost" type="email" autocomplete="username" inputmode="email" />
    <label for="passord">Passord</label>
    <input class="hinput" id="passord" type="password" autocomplete="current-password" />
    <div style="margin-top:14px">
      <button class="btn-primary" id="inn-btn">Logg inn</button>
    </div>
    <div class="glemt"><button class="btn-lenke" id="glemt-btn">Glemt passord?</button></div>
  </div>
  <div class="status-bar" id="status-bar"></div>
</div>

<script type="module">
import { auth, loggInn, glemtPassord } from './felles/auth.js';
import { initTheme, setStatus } from './felles/ui.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

initTheme();

const feilEl = document.getElementById('feil');
function visFeil(msg) { feilEl.textContent = msg; feilEl.style.display = 'block'; }

// Kom brukeren hit med ?feil=ingen-tilgang: forklar hvorfor, og logg ut
// stille så neste innloggingsforsøk starter med blanke ark.
if (new URLSearchParams(location.search).get('feil') === 'ingen-tilgang') {
  visFeil('Kontoen din er ikke knyttet til en husstand. Kontakt administrator.');
  signOut(auth).catch(() => {});
}

// Allerede innlogget → rett til launcheren
onAuthStateChanged(auth, user => { if (user && !feilEl.textContent) location.replace('index.html'); });

const FEILTEKST = {
  'auth/invalid-credential': 'Feil e-post eller passord.',
  'auth/invalid-email': 'Ugyldig e-postadresse.',
  'auth/user-disabled': 'Kontoen er deaktivert. Kontakt administrator.',
  'auth/too-many-requests': 'For mange forsøk – vent litt og prøv igjen.',
  'auth/network-request-failed': 'Fikk ikke kontakt – sjekk nettforbindelsen.',
};

async function inn() {
  const epost = document.getElementById('epost').value.trim();
  const passord = document.getElementById('passord').value;
  if (!epost || !passord) { visFeil('Fyll inn e-post og passord.'); return; }
  const btn = document.getElementById('inn-btn');
  btn.disabled = true; btn.textContent = 'Logger inn...';
  feilEl.style.display = 'none'; feilEl.textContent = '';
  try {
    await loggInn(epost, passord);
    location.replace('index.html');
  } catch (e) {
    visFeil(FEILTEKST[e.code] || 'Innlogging feilet. Prøv igjen.');
    btn.disabled = false; btn.textContent = 'Logg inn';
  }
}

document.getElementById('inn-btn').addEventListener('click', inn);
document.getElementById('passord').addEventListener('keydown', e => { if (e.key === 'Enter') inn(); });

document.getElementById('glemt-btn').addEventListener('click', async () => {
  const epost = document.getElementById('epost').value.trim();
  if (!epost) { visFeil('Skriv inn e-posten din først, og trykk «Glemt passord?» igjen.'); return; }
  try {
    await glemtPassord(epost);
    setStatus('E-post for tilbakestilling er sendt til ' + epost, 'ok');
    feilEl.style.display = 'none';
  } catch (e) {
    visFeil('Kunne ikke sende tilbakestillings-e-post. Er adressen riktig?');
  }
});
</script>
</body>
</html>
