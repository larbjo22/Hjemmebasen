<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e5d4f">
<link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Hjemmebasen – Logg inn</title>
<link rel="stylesheet" href="felles/stil.css">
<style>
.login-wrap{max-width:360px;margin:0 auto;padding:14vh 1rem 2rem}
.logo{text-align:center;margin-bottom:1.4rem}
.logo .emoji{font-size:52px;display:block;margin-bottom:8px}
.logo h1{font-size:20px;font-weight:800}
.logo p{font-size:12px;color:var(--text3);margin-top:3px}
.feil{display:none;font-size:12.5px;color:var(--danger);background:rgba(229,62,62,.08);border:1px solid rgba(229,62,62,.3);border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.4}
.glemt{text-align:center;margin-top:12px}
</style>
<link rel="stylesheet" href="felles/gran.css">
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <span class="emoji" style="color:var(--accent-text)"><i class="ti ti-home"></i></span>
    <h1>Hjemmebasen</h1>
    <p>Familiens apper – samlet på ett sted</p>
  </div>
  <div class="card">
    <p class="feil" id="feil"></p>
    <label for="epost">E-post</label>
    <input class="hinput" id="epost" type="email" autocomplete="username" inputmode="email" />
    <label for="passord">Passord</label>
    <input class="hinput" id="passord" type="password" autocomplete="current-password" />
    <div style="margin-top:14px">
      <button class="btn-primary" id="inn-btn">Logg inn</button>
    </div>
    <div class="glemt"><button class="btn-lenke" id="glemt-btn">Glemt passord?</button></div>
    <div class="glemt" style="margin-top:6px"><a class="btn-lenke" href="bli-med.html" style="text-decoration:underline">Har du fått en invitasjonskode?</a></div>
    <div class="glemt" style="margin-top:6px"><a class="btn-lenke" href="om.html" style="text-decoration:underline">Hva er Hjemmebasen?</a></div>
  </div>
  <div class="status-bar" id="status-bar"></div>
</div>

<script type="module">
import { auth, loggInn, glemtPassord, sendVerifisering } from './felles/auth.js';
import { initTheme, setStatus } from './felles/ui.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

initTheme();

const feilEl = document.getElementById('feil');
function visFeil(msg) { feilEl.textContent = msg; feilEl.style.display = 'block'; }

// Verifiseringsskjerm: forklaring + «send på nytt» + «jeg har bekreftet».
let verifiserVist = false;
function visVerifiser(bruker) {
  verifiserVist = true;
  const epost = bruker?.email || document.getElementById('epost').value.trim();
  visFeil('Bekreft e-posten din før du logger inn. Vi har sendt en lenke til ' + (epost || 'adressen din') + ' – sjekk også søppelpost.');
  let boks = document.getElementById('verifiser-boks');
  if (!boks) {
    boks = document.createElement('div');
    boks.id = 'verifiser-boks';
    boks.style.cssText = 'display:flex;gap:6px;margin-top:10px';
    boks.innerHTML = '<button class="btn-ghost" id="verifiser-send" style="flex:1">Send lenke på nytt</button>'
      + '<button class="btn-primary" id="verifiser-prov" style="flex:1;width:auto">Jeg har bekreftet</button>';
    feilEl.parentNode.insertBefore(boks, feilEl.nextSibling);
    document.getElementById('verifiser-send').addEventListener('click', async () => {
      try { await sendVerifisering(auth.currentUser); setStatus('Bekreftelseslenke sendt ✓', 'ok'); }
      catch (e) { setStatus('Kunne ikke sende – prøv igjen om litt', 'err'); }
    });
    document.getElementById('verifiser-prov').addEventListener('click', async () => {
      try { await auth.currentUser?.reload(); } catch (e) { /* ignore */ }
      if (auth.currentUser?.emailVerified) location.replace('index.html');
      else setStatus('Ikke bekreftet ennå – klikk lenken i e-posten først', 'err');
    });
  }
}

// Kom brukeren hit med ?feil=ingen-tilgang: forklar hvorfor, og logg ut
// stille så neste innloggingsforsøk starter med blanke ark.
const feilParam = new URLSearchParams(location.search).get('feil');
if (feilParam === 'ingen-tilgang') {
  visFeil('Kontoen din er ikke knyttet til en husstand. Kontakt administrator.');
  signOut(auth).catch(() => {});
}

// Allerede innlogget → rett til launcheren (men bare hvis e-posten er bekreftet)
onAuthStateChanged(auth, user => {
  if (!user) return;
  if (feilParam === 'ikke-verifisert' || !user.emailVerified) { visVerifiser(user); return; }
  if (!feilEl.textContent) location.replace('index.html');
});

const FEILTEKST = {
  'auth/invalid-credential': 'Feil e-post eller passord.',
  'auth/invalid-email': 'Ugyldig e-postadresse.',
  'auth/user-disabled': 'Kontoen er deaktivert. Kontakt administrator.',
  'auth/too-many-requests': 'For mange forsøk – vent litt og prøv igjen.',
  'auth/network-request-failed': 'Fikk ikke kontakt – sjekk nettforbindelsen.',
};

async function inn() {
  const epost = document.getElementById('epost').value.trim();
  const passord = document.getElementById('passord').value;
  if (!epost || !passord) { visFeil('Fyll inn e-post og passord.'); return; }
  const btn = document.getElementById('inn-btn');
  btn.disabled = true; btn.textContent = 'Logger inn...';
  feilEl.style.display = 'none'; feilEl.textContent = '';
  try {
    const cred = await loggInn(epost, passord);
    if (!cred.user.emailVerified) {
      try { await sendVerifisering(cred.user); } catch (e) { /* vises som «send på nytt» */ }
      visVerifiser(cred.user);
      btn.disabled = false; btn.textContent = 'Logg inn';
      return;
    }
    location.replace('index.html');
  } catch (e) {
    visFeil(FEILTEKST[e.code] || 'Innlogging feilet. Prøv igjen.');
    btn.disabled = false; btn.textContent = 'Logg inn';
  }
}

document.getElementById('inn-btn').addEventListener('click', inn);
document.getElementById('passord').addEventListener('keydown', e => { if (e.key === 'Enter') inn(); });

document.getElementById('glemt-btn').addEventListener('click', async () => {
  const epost = document.getElementById('epost').value.trim();
  if (!epost) { visFeil('Skriv inn e-posten din først, og trykk «Glemt passord?» igjen.'); return; }
  try {
    await glemtPassord(epost);
    setStatus('E-post for tilbakestilling er sendt til ' + epost, 'ok');
    feilEl.style.display = 'none';
  } catch (e) {
    visFeil('Kunne ikke sende tilbakestillings-e-post. Er adressen riktig?');
  }
});
</script>
</body>
</html>
