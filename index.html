<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hjemmebasen</title>
<link rel="stylesheet" href="felles/stil.css">
<style>
/* Dashbord-fliser med statuslinje */
.app-tile{text-align:left;padding:14px;display:flex;align-items:center;gap:12px}
.app-tile .emoji{font-size:30px;display:block;margin-bottom:0;flex-shrink:0}
.tile-tekst{flex:1;min-width:0}
.app-tile .navn{display:block}
.tile-status{display:block;font-size:11.5px;color:var(--text3);margin-top:3px;line-height:1.4;overflow:hidden;text-overflow:ellipsis}
.tile-status.varsel{color:var(--accent-text);font-weight:600}
.tile-linje{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-linje.overtid{color:var(--danger)}
.dash-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--text4);cursor:pointer;font-size:11px;line-height:1;flex-shrink:0;padding:0}
.dash-check:hover{border-color:var(--accent);color:var(--accent)}
.app-tile.kommer .tile-status{font-style:italic}
.admin-lenke{display:block;text-align:center;margin-top:14px;font-size:12px;color:var(--text3);text-decoration:none}
.admin-lenke:hover{color:var(--accent-text)}
#meny{position:absolute;right:0;top:34px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:50;min-width:170px;overflow:hidden}
#meny a,#meny button{display:block;width:100%;text-align:left;padding:10px 14px;font-size:13px;border:none;background:none;color:var(--text);cursor:pointer;text-decoration:none}
#meny a:hover,#meny button:hover{background:var(--surface2)}
/* PC: bredere brett og flere kolonner – samme kode, bare CSS */
@media(min-width:700px){
  .fw{max-width:760px}
  .app-grid{grid-template-columns:repeat(3,1fr);gap:12px}
}
@media(min-width:1100px){
  .fw{max-width:980px}
  .app-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="fw">
  <div class="top-bar" style="position:relative">
    <p class="app-title">🏠 <span id="fam-navn">Hjemmebasen</span></p>
    <div class="top-right">
      <button class="icon-btn" id="theme-btn"></button>
      <button class="icon-btn" id="meny-btn">⚙️</button>
      <div id="meny" style="display:none">
        <a href="onboarding.html" id="meny-oppsett">Endre oppsett</a>
        <button id="logg-ut-btn">Logg ut</button>
      </div>
    </div>
  </div>

  <div class="app-grid" id="app-grid"></div>

  <a class="admin-lenke" id="admin-lenke" href="admin.html" style="display:none">🔧 Administrer husstander</a>
  <div class="status-bar" id="status-bar"></div>
</div>

<script type="module">
import { requireAuth, loggUt, db } from './felles/auth.js';
import { esc, todayStr, initTheme, toggleTheme } from './felles/ui.js';
import { APP_NAVN, APP_IKON } from './felles/seed.js';
import { ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

initTheme();
document.getElementById('theme-btn').addEventListener('click', toggleTheme);
document.getElementById('meny-btn').addEventListener('click', () => {
  const m = document.getElementById('meny');
  m.style.display = m.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('logg-ut-btn').addEventListener('click', loggUt);

// Alle apper er bygget fra og med etappe 3
const BYGGET = new Set(['handleliste', 'middag', 'oppgaver', 'fryser', 'plikter', 'sovn', 'helse']);

const { erAdmin, familieId } = await requireAuth();
if (erAdmin) document.getElementById('admin-lenke').style.display = 'block';

if (!familieId) {
  document.getElementById('app-grid').innerHTML =
    '<div class="empty-state" style="grid-column:1/-1">Du er administrator uten egen husstand.<br>Bruk admin-siden for å opprette husstander.</div>';
  document.getElementById('meny-oppsett').style.display = 'none';
} else {
  // Lytter på hele husstanden → dashbordet er alltid ferskt (read-only her)
  onValue(ref(db, 'familier/' + familieId), snap => {
    const fam = snap.exists() ? snap.val() : {};
    const meta = fam.meta || {};
    if (!meta.onboardet) { location.replace('onboarding.html'); return; }
    document.getElementById('fam-navn').textContent = meta.navn || 'Hjemmebasen';
    document.title = meta.navn ? meta.navn + ' – Hjemmebasen' : 'Hjemmebasen';
    tegnDashbord(fam, meta);
  });
}

// ── Statuslinje per app – «enkel og god oversikt» ────────────
function dagerMellom(a, b) { return Math.floor((new Date(a) - new Date(b)) / 86400000); }

function appStatus(app, fam) {
  const d = fam[app];
  try {
    if (app === 'handleliste') {
      const uavh = (d?.items || []).filter(i => !i.checked);
      const div = (d?.other || []).filter(o => !o.checked).length;
      if (!uavh.length && !div) return { txt: 'Lista er tom ✓' };
      return {
        txt: uavh.length + ' å handle' + (div ? ' · ' + div + ' diverse' : ''), varsel: uavh.length > 0,
        // Interaktivt: de første varene kan hukes av rett fra forsiden
        linjer: uavh.slice(0, 3).map(i => ({ id: i.id, tekst: i.name + (i.qty > 1 ? ' ×' + i.qty : ''), handling: 'hl-check' })),
        flere: Math.max(0, uavh.length - 3),
      };
    }
    if (app === 'middag') {
      const meals = d?.meals || [];
      const idag = meals.find(m => m.date === todayStr());
      const imorgenDato = new Date(); imorgenDato.setDate(imorgenDato.getDate() + 1);
      const iStr = imorgenDato.getFullYear() + '-' + String(imorgenDato.getMonth() + 1).padStart(2, '0') + '-' + String(imorgenDato.getDate()).padStart(2, '0');
      const imorgen = meals.find(m => m.date === iStr);
      const linjer = [];
      if (idag) linjer.push({ tekst: 'I dag: ' + idag.meal });
      if (imorgen) linjer.push({ tekst: 'I morgen: ' + imorgen.meal });
      if (!idag) return { txt: 'Ingen middag planlagt i dag', linjer };
      return { txt: '', varsel: true, linjer };
    }
    if (app === 'oppgaver') {
      const aapne = (d?.tasks || []).filter(t => !t.done);
      const forfalt = aapne.filter(t => t.date && t.date < todayStr()).length;
      if (!aapne.length) return { txt: 'Alt gjort ✓' };
      const sortert = [...aapne].sort((a, b) => (a.date || '9999') < (b.date || '9999') ? -1 : 1);
      return {
        txt: aapne.length + ' åpne' + (forfalt ? ' · ' + forfalt + ' på overtid' : ''), varsel: forfalt > 0,
        linjer: sortert.slice(0, 3).map(t => ({ id: t.id, tekst: t.title, handling: 'opg-check', overtid: !!(t.date && t.date < todayStr()) })),
        flere: Math.max(0, aapne.length - 3),
      };
    }
    if (app === 'fryser') {
      const items = d?.items || [];
      const brukOpp = items.filter(i => {
        const alder = i.added ? dagerMellom(todayStr(), i.added) : null;
        const utlop = i.expiry ? dagerMellom(i.expiry, todayStr()) : null;
        return (alder !== null && alder >= 90) || (utlop !== null && utlop <= 30);
      }).length;
      if (!items.length) return { txt: 'Tom fryser' };
      return { txt: items.length + ' varer' + (brukOpp ? ' · ' + brukOpp + ' bør brukes opp' : ''), varsel: brukOpp > 0 };
    }
    if (app === 'plikter') {
      const barn = (d?.kids || []).length;
      const plikter = (d?.chores || []).length;
      if (!barn) return { txt: 'Ingen barn lagt til ennå' };
      return { txt: barn + ' barn · ' + plikter + ' plikter' };
    }
    if (app === 'sovn') {
      const barnReg = fam.personer?.barn || [];
      const navn = id => barnReg.find(b => String(b.id) === String(id))?.navn || 'barnet';
      const sover = Object.entries(d || {}).filter(([, blob]) => blob?.state === 'sleeping');
      if (sover.length) {
        const t = new Date(sover[0][1].since);
        return { txt: sover.map(([id]) => navn(id)).join(' og ') + ' sover 💤 siden '
          + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'), varsel: true };
      }
      if (!barnReg.length) return { txt: 'Ingen barn registrert' };
      return { txt: 'Alle våkne ☀️' };
    }
    if (app === 'helse') {
      const doser = d?.doser || [];
      const meds = d?.medisiner || [];
      const now = Date.now();
      const barnReg = fam.personer?.barn || [];
      const navn = id => barnReg.find(b => b.id === id)?.navn || 'barnet';
      // Nyeste aktive dose (siste 2 døgn): vis når neste kan gis
      const aktive = doser.filter(x => now - x.ts < 48 * 3600000).sort((a, b) => b.ts - a.ts);
      if (aktive.length) {
        const dse = aktive[0];
        const med = meds.find(m => m.id === dse.med);
        if (med) {
          const okAt = dse.ts + med.intervalH * 3600000;
          const t = new Date(okAt);
          if (now < okAt) return { txt: navn(dse.barn) + ': neste ' + med.name + ' kl '
            + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'), varsel: true };
          return { txt: navn(dse.barn) + ': ' + med.name + ' kan gis nå ✓', varsel: true };
        }
      }
      return { txt: 'Ingen aktive medisiner 💚' };
    }
  } catch (e) { /* defensivt: en rar blob skal aldri velte dashbordet */ }
  return { txt: '' };
}

let sisteFam = null; // ferske data fra lytteren – brukes av hurtighandlingene
function tegnDashbord(fam, meta) {
  sisteFam = fam;
  const apper = meta.apper || {};
  const aktive = Object.keys(APP_NAVN).filter(a => apper[a] !== false);
  document.getElementById('app-grid').innerHTML = aktive.map(a => {
    if (BYGGET.has(a)) {
      const s = appStatus(a, fam);
      let inner = '';
      if (s.txt) inner += '<span class="tile-status' + (s.varsel ? ' varsel' : '') + '">' + esc(s.txt) + '</span>';
      if (s.linjer?.length) {
        inner += s.linjer.map(l =>
          '<span class="tile-linje' + (l.overtid ? ' overtid' : '') + '">'
          + (l.handling ? '<button class="dash-check" data-handling="' + l.handling + '" data-id="' + l.id + '" title="Merk som gjort" aria-label="Merk som gjort">○</button>' : '')
          + esc(l.tekst) + '</span>').join('');
        if (s.flere) inner += '<span class="tile-status">+ ' + s.flere + ' til…</span>';
      }
      return '<a class="app-tile" href="' + a + '.html">'
        + '<span class="emoji">' + APP_IKON[a] + '</span>'
        + '<span class="tile-tekst"><span class="navn">' + esc(APP_NAVN[a]) + '</span>' + inner + '</span></a>';
    }
    return '<div class="app-tile kommer">'
      + '<span class="emoji">' + APP_IKON[a] + '</span>'
      + '<span class="tile-tekst"><span class="navn">' + esc(APP_NAVN[a]) + '</span>'
      + '<span class="tile-status">kommer snart</span></span></div>';
  }).join('') || '<div class="empty-state" style="grid-column:1/-1">Ingen apper er aktivert for husstanden.</div>';
}

// ── Hurtighandlinger rett fra forsiden ───────────────────────
// Datasettet kommer ferskt fra onValue-lytteren (autoritativ lesning),
// så en kirurgisk skriving av items/tasks-arrayen er trygg.
document.getElementById('app-grid').addEventListener('click', async e => {
  const btn = e.target.closest('.dash-check');
  if (!btn || !sisteFam || !familieId) return;
  e.preventDefault(); e.stopPropagation();
  btn.textContent = '✓'; btn.disabled = true;
  try {
    if (btn.dataset.handling === 'hl-check') {
      const items = (sisteFam.handleliste?.items || []).map(i =>
        i.id === parseInt(btn.dataset.id) ? { ...i, checked: true } : i);
      await set(ref(db, 'familier/' + familieId + '/handleliste/items'), items);
    } else if (btn.dataset.handling === 'opg-check') {
      const tasks = (sisteFam.oppgaver?.tasks || []).map(t =>
        t.id === parseInt(btn.dataset.id) ? { ...t, done: true, doneDate: todayStr() } : t);
      await set(ref(db, 'familier/' + familieId + '/oppgaver/tasks'), tasks);
    }
    // Lytteren tegner dashbordet på nytt når skrivingen lander
  } catch (err) { btn.textContent = '○'; btn.disabled = false; }
});
</script>
</body>
</html>
