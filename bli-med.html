<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f97316">
<link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Hjemmebasen – Bli med</title>
<link rel="stylesheet" href="felles/stil.css">
<style>
.wrap{max-width:380px;margin:0 auto;padding:8vh 1rem 2rem}
.logo{text-align:center;margin-bottom:1.2rem}
.logo .emoji{font-size:46px;display:block;margin-bottom:6px}
.logo h1{font-size:19px;font-weight:800}
.logo p{font-size:12px;color:var(--text3);margin-top:3px;line-height:1.5}
.feil{display:none;font-size:12.5px;color:var(--danger);background:rgba(229,62,62,.08);border:1px solid rgba(229,62,62,.3);border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.4}
.tilbake{text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <span class="emoji">🏠</span>
    <h1>Bli med i husstanden</h1>
    <p>Noen har invitert deg til Hjemmebasen – familiens apper samlet på ett sted. Lag din egen innlogging under.</p>
  </div>
  <div class="card">
    <p class="feil" id="feil"></p>
    <label for="navn">Navnet ditt</label>
    <input class="hinput" id="navn" maxlength="40" placeholder="F.eks. Kari" autocomplete="name" />
    <label for="epost">E-post (blir innloggingen din)</label>
    <input class="hinput" id="epost" type="email" autocomplete="username" inputmode="email" />
    <label for="passord">Velg et passord (min. 6 tegn)</label>
    <input class="hinput" id="passord" type="password" autocomplete="new-password" />
    <label for="kode">Invitasjonskode</label>
    <input class="hinput" id="kode" maxlength="12" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:.15em;font-weight:700" />
    <div style="margin-top:14px">
      <button class="btn-primary" id="bli-med-btn">Bli med 🎉</button>
    </div>
  </div>
  <div class="tilbake"><a href="login.html" class="btn-lenke" style="text-decoration:underline">Har du allerede en konto? Logg inn</a></div>
  <div class="status-bar" id="status-bar"></div>
</div>

<script type="module">
import { app } from './felles/firebase-init.js';
import { initTheme, setStatus } from './felles/ui.js';
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  setPersistence, browserLocalPersistence,
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getDatabase, ref, get, set } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

initTheme();
const auth = getAuth(app);
const db = getDatabase(app);

// Invitasjonslenken bærer husstand-id og kode: bli-med.html?f=<id>&k=<kode>
const params = new URLSearchParams(location.search);
const familieId = params.get('f') || '';
document.getElementById('kode').value = (params.get('k') || '').toUpperCase();

const feilEl = document.getElementById('feil');
function visFeil(msg) { feilEl.textContent = msg; feilEl.style.display = 'block'; }

if (!familieId) {
  visFeil('Lenken mangler husstands-id. Be den som inviterte deg om å sende invitasjonslenken på nytt.');
  document.getElementById('bli-med-btn').disabled = true;
}

document.getElementById('bli-med-btn').addEventListener('click', async () => {
  const navn = document.getElementById('navn').value.trim();
  const epost = document.getElementById('epost').value.trim();
  const passord = document.getElementById('passord').value;
  const kode = document.getElementById('kode').value.trim().toUpperCase();
  if (!navn || !epost || passord.length < 6 || !kode) {
    visFeil('Fyll inn navn, e-post, passord (min. 6 tegn) og invitasjonskode.');
    return;
  }
  const btn = document.getElementById('bli-med-btn');
  btn.disabled = true; btn.textContent = 'Blir med...';
  feilEl.style.display = 'none';
  try {
    await setPersistence(auth, browserLocalPersistence);
    // Opprett konto – eller logg inn hvis kontoen alt finnes (halvveis forsøk)
    let cred;
    try {
      cred = await createUserWithEmailAndPassword(auth, epost, passord);
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') {
        cred = await signInWithEmailAndPassword(auth, epost, passord);
      } else throw e;
    }
    // Har kontoen allerede en husstand? Da er alt i orden – gå hjem.
    const eksisterende = await get(ref(db, 'brukere/' + cred.user.uid)).catch(() => null);
    if (eksisterende && eksisterende.exists()) { location.replace('index.html'); return; }
    // Security rules validerer koden mot husstandens invitasjonskode –
    // feil kode gir «permission denied», ingen datatilgang lekker.
    await set(ref(db, 'brukere/' + cred.user.uid), {
      familieId, navn, epost, kode,
      opprettet: Date.now(), sistSett: 0,
    });
    location.replace('index.html');
  } catch (e) {
    const tekst = e.code === 'auth/email-already-in-use' ? 'E-posten er i bruk med et annet passord.'
      : e.code === 'auth/invalid-credential' ? 'E-posten er alt i bruk – og passordet stemmer ikke med den kontoen.'
      : e.code === 'auth/invalid-email' ? 'Ugyldig e-postadresse.'
      : e.code === 'auth/weak-password' ? 'Passordet er for svakt (min. 6 tegn).'
      : (e.message || '').includes('permission') || (e.code || '').includes('PERMISSION')
        ? 'Invitasjonskoden stemmer ikke (eller er deaktivert). Sjekk med den som inviterte deg.'
      : 'Noe gikk galt: ' + (e.message || 'prøv igjen');
    visFeil(tekst);
    btn.disabled = false; btn.textContent = 'Bli med 🎉';
  }
});
</script>
</body>
</html>
