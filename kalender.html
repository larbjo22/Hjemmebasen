<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e5d4f">
<link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Kalender</title>
<link rel="stylesheet" href="felles/stil.css">
<style>
.kal-topp{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kal-topp .mnd{flex:1;text-align:center;font-size:15px;font-weight:700}
.kal-nav{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-size:16px}
.ukedager{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.ukedager div{text-align:center;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase}
.kal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dag{min-height:58px;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:3px 4px;cursor:pointer;overflow:hidden}
.dag.tom{background:transparent;border:none;cursor:default}
.dag.idag{border-color:var(--accent);border-width:1.5px}
.dag.valgt{background:var(--accent-bg)}
.dag-nr{font-size:11px;font-weight:600;color:var(--text2)}
.dag.idag .dag-nr{color:var(--accent-text)}
.hpille{display:block;font-size:9.5px;line-height:1.35;color:#fff;border-radius:4px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmer{font-size:9px;color:var(--text3);margin-top:1px}
.hpille.eks{opacity:.85;font-style:italic}
.hrad.eks-rad{opacity:.9}
.koble-rad{text-align:center;margin-top:8px}
.ab-rad{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border2)}
.ab-rad:last-child{border-bottom:none}
.ab-rad .navn{flex:1;min-width:0;font-size:13px}
.ab-rad .url{font-size:10.5px;color:var(--text4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dagpanel{margin-top:14px}
.dag-tittel{font-size:14px;font-weight:700;margin-bottom:8px;text-transform:capitalize}
.hrad{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border2)}
.hrad:last-child{border-bottom:none}
.hprikk{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.hrad-main{flex:1;min-width:0}
.hrad-tittel{font-size:13.5px;font-weight:600}
.hrad-sub{font-size:11px;color:var(--text3);margin-top:1px}
.komm-knapp{position:relative}
.komm-tall{font-size:10px;font-weight:700;margin-left:2px}
.komm-boks{margin:2px 0 8px 19px;padding:8px 10px;background:var(--surface2);border-radius:10px}
.komm-rad{font-size:12px;line-height:1.4;margin-bottom:5px}
.komm-rad b{font-weight:600}
.komm-rad .naar{color:var(--text4);font-size:10.5px;margin-left:4px}
.komm-skriv{display:flex;gap:6px;margin-top:6px}
.komm-skriv .hinput{flex:1;min-width:0;margin:0;font-size:12.5px;padding:6px 8px}
.skjema{display:grid;gap:7px;margin-top:10px}
.skjema .rad2{display:flex;gap:7px}
.skjema .rad2 .hinput,.skjema .rad2 select{flex:1;min-width:0}
@media(min-width:700px){.fw{max-width:620px}.dag{min-height:70px}}
</style>
<link rel="stylesheet" href="felles/gran.css">
</head>
<body>
<div class="fw">
  <div class="top-bar">
    <h1 class="app-title"><i class="ti ti-calendar"></i> Kalender</h1>
    <div class="top-right">
      <button class="icon-btn" id="theme-btn"></button>
    </div>
  </div>

  <div class="card">
    <div class="kal-topp">
      <button class="kal-nav" id="forrige" aria-label="Forrige måned">‹</button>
      <div class="mnd" id="mnd-label"></div>
      <button class="kal-nav" id="neste" aria-label="Neste måned">›</button>
    </div>
    <div class="ukedager"><div>Man</div><div>Tir</div><div>Ons</div><div>Tor</div><div>Fre</div><div>Lør</div><div>Søn</div></div>
    <div class="kal-grid" id="grid"></div>
    <div class="koble-rad"><button class="btn-lenke" id="abonner-btn"><i class="ti ti-calendar-share"></i> Eksterne kalendere</button></div>
  </div>

  <div class="card dagpanel" id="dagpanel" style="display:none">
    <div class="dag-tittel" id="dag-tittel"></div>
    <div id="dag-hendelser"></div>
    <div class="skjema">
      <input type="text" id="h-tittel" class="hinput" maxlength="60" placeholder="Hva skjer? F.eks. «Legetime», «Fotballtrening»" />
      <div class="rad2">
        <input type="time" id="h-tid" class="hinput" />
        <select id="h-hvem" class="hinput"></select>
      </div>
      <input type="text" id="h-notat" class="hinput" maxlength="120" placeholder="Notat (valgfritt)" />
      <div style="display:flex;gap:6px">
        <button class="btn-primary" id="h-lagre" style="flex:1;width:auto">Legg til</button>
        <button class="btn-ghost" id="h-avbryt" style="display:none">Avbryt</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="abonner-modal" style="display:none">
    <div class="modal">
      <p class="modal-title"><i class="ti ti-calendar-share" style="color:var(--accent-text)"></i> Eksterne kalendere</p>
      <p style="font-size:11.5px;color:var(--text3);line-height:1.5;margin-bottom:10px">Lim inn den <b>hemmelige iCal-URL-en</b> (Google Kalender → Innstillinger → velg kalenderen → «Hemmelig adresse i iCal-format»). Hendelsene hentes automatisk og vises grått og skrivebeskyttet. Det kan ta opptil en time før nye dukker opp.</p>
      <div id="abonner-liste"></div>
      <label for="ab-navn">Navn</label>
      <input class="hinput" id="ab-navn" maxlength="30" placeholder="F.eks. Google, Spond, barnehagen" />
      <label for="ab-url">iCal-URL (.ics)</label>
      <input class="hinput" id="ab-url" placeholder="https://calendar.google.com/.../basic.ics" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <div class="modal-actions">
        <button class="btn-ghost" id="ab-lukk">Lukk</button>
        <button class="btn-primary" id="ab-legg">Legg til</button>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status-bar"></div>
</div>

<script type="module">
import { requireAuth } from './felles/auth.js';
import { dbGet, dbSet, dbListen } from './felles/storage.js';
import { esc, todayStr, initTheme, toggleTheme, setStatus, personFarge } from './felles/ui.js';
import { monterNav } from './felles/nav.js';

initTheme();
document.getElementById('theme-btn').addEventListener('click', toggleTheme);

const APP='kalender';
const MND=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
let FAMILIE=null, data=null, dataLoaded=false, sistSkrevet='', personer=[];
let visAar, visMnd, valgtDato=null, redigerId=null, mittNavn='', apenKommentar=null, apenEksport=null;
let eksterne=[], abonnement=[], eksMapCache={};
const EKS_FARGE='#6d7a74';

function normaliser(d){
  const b=d||{};
  if(!Array.isArray(b.hendelser))b.hendelser=[];
  b.hendelser.forEach(h=>{if(!Array.isArray(h.kommentarer))h.kommentarer=[];});
  const maxId=Math.max(0,...b.hendelser.map(h=>h.id||0));
  if(!b.nextId||b.nextId<=maxId)b.nextId=maxId+1;
  return b;
}

async function load(){
  setStatus('Laster...');
  try{
    const ctx=await requireAuth();
    if(!ctx.familieId){setStatus('Ingen husstand – kontakt administrator','err');return;}
    FAMILIE=ctx.familieId;
    mittNavn=(ctx.medlem?.navn||'').split(' ')[0]||'Ukjent';
    monterNav(FAMILIE,APP);
    const p=await dbGet(FAMILIE,'personer');
    personer=[...(p?.voksne||[]),...((p?.barn||[]).map(b=>b.navn))].filter(Boolean);
    data=normaliser(await dbGet(FAMILIE,APP));
    abonnement=await dbGet(FAMILIE,'kalender_abonnement');
    if(!Array.isArray(abonnement))abonnement=[];
    eksMapCache=await dbGet(FAMILIE,'kalender_eksterne')||{};
    flatUtEksterne(eksMapCache);
    dataLoaded=true;
    setStatus('');
    startListen();
  }catch(e){setStatus('Kunne ikke laste – '+(e.message||'prøv igjen'),'err');return;}
  const n=new Date();
  visAar=n.getFullYear(); visMnd=n.getMonth();
  fyllHvem();
  render();
}

async function save(){
  if(!dataLoaded){setStatus('Ikke lagret – data er ikke lastet','err');return;}
  try{
    sistSkrevet=JSON.stringify(data);
    await dbSet(FAMILIE,APP,data);
    setStatus('Lagret ✓','ok');
  }catch(e){setStatus('Kunne ikke lagre – prøv igjen','err');}
}

let stopListen=null;
function startListen(){
  if(stopListen)return;
  stopListen=dbListen(FAMILIE,APP,saved=>{
    if(!saved)return;
    if(JSON.stringify(saved)===sistSkrevet)return;
    const s=JSON.stringify(normaliser(saved));
    if(s===JSON.stringify(data))return;
    if(document.getElementById('h-tittel').value.trim())return; // noen skriver
    if(document.getElementById('komm-inp')?.value.trim())return; // noen skriver en kommentar
    data=JSON.parse(s);
    render();
  });
}

function fyllHvem(){
  document.getElementById('h-hvem').innerHTML='<option value="">Hele familien</option>'
    +personer.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');
}
function farge(hvem){return hvem?personFarge(hvem):'var(--accent)';}
function toStr(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function hendelserPa(dato){return data.hendelser.filter(h=>h.dato===dato).sort((a,b)=>(a.tid||'99').localeCompare(b.tid||'99'));}
function eksternePa(dato){return eksterne.filter(e=>e.dato===dato).sort((a,b)=>(a.tid||'99').localeCompare(b.tid||'99'));}
function flatUtEksterne(eksMap){
  eksterne=[];
  const m=eksMap||{};
  abonnement.forEach(a=>{(m[a.id]||[]).forEach(ev=>{ if(ev&&ev.dato&&ev.tittel)eksterne.push({tittel:ev.tittel,dato:ev.dato,tid:ev.tid||'',kilde:a.navn||'Ekstern'}); });});
}
// ── Eksport ut (Google-lenke + .ics) ──
function fmtG(dt){const p=n=>String(n).padStart(2,'0');return dt.getFullYear()+p(dt.getMonth()+1)+p(dt.getDate())+'T'+p(dt.getHours())+p(dt.getMinutes())+'00';}
function googleUrl(h){
  const dd=h.dato.replace(/-/g,''); let dates;
  if(h.tid){const st=new Date(h.dato+'T'+h.tid+':00');const en=new Date(st.getTime()+3600000);dates=fmtG(st)+'/'+fmtG(en);}
  else{const nd=new Date(h.dato+'T12:00:00');nd.setDate(nd.getDate()+1);const p=n=>String(n).padStart(2,'0');dates=dd+'/'+nd.getFullYear()+p(nd.getMonth()+1)+p(nd.getDate());}
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(h.tittel)+'&dates='+dates+(h.notat?'&details='+encodeURIComponent(h.notat):'');
}
function icsEsc(x){return String(x||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');}
function byggIcs(h){
  const p=n=>String(n).padStart(2,'0'); let dt;
  if(h.tid){const st=new Date(h.dato+'T'+h.tid+':00');const en=new Date(st.getTime()+3600000);
    const f=x=>x.getFullYear()+p(x.getMonth()+1)+p(x.getDate())+'T'+p(x.getHours())+p(x.getMinutes())+'00';
    dt='DTSTART:'+f(st)+'\r\nDTEND:'+f(en);
  }else{const nd=new Date(h.dato+'T12:00:00');nd.setDate(nd.getDate()+1);
    dt='DTSTART;VALUE=DATE:'+h.dato.replace(/-/g,'')+'\r\nDTEND;VALUE=DATE:'+nd.getFullYear()+p(nd.getMonth()+1)+p(nd.getDate());}
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Hjemmebasen//NO','BEGIN:VEVENT','UID:hb-'+h.id+'@hjemmebasen','SUMMARY:'+icsEsc(h.tittel),dt,h.notat?'DESCRIPTION:'+icsEsc(h.notat):null,'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
}
function lastNedIcs(h){
  const blob=new Blob([byggIcs(h)],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(h.tittel||'hendelse').replace(/[^\w-]+/g,'_').slice(0,40)+'.ics';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},100);
}
function eksportBoks(h){
  return '<div class="komm-boks"><div style="display:flex;gap:6px;flex-wrap:wrap">'
    +'<a class="btn-ghost" style="flex:1;width:auto;text-decoration:none;text-align:center" href="'+googleUrl(h)+'" target="_blank" rel="noopener"><i class="ti ti-calendar-plus"></i> Google Kalender</a>'
    +'<button class="btn-ghost" style="flex:1;width:auto" data-ics="'+h.id+'"><i class="ti ti-download"></i> Last ned (.ics)</button>'
    +'</div><p style="font-size:10.5px;color:var(--text4);margin-top:6px">.ics åpner i Apple/Outlook/Google. Google-knappen legger til direkte.</p></div>';
}

function render(){
  document.getElementById('mnd-label').textContent=MND[visMnd].charAt(0).toUpperCase()+MND[visMnd].slice(1)+' '+visAar;
  const forste=new Date(visAar,visMnd,1);
  const offset=(forste.getDay()+6)%7; // mandag=0
  const dager=new Date(visAar,visMnd+1,0).getDate();
  const idag=todayStr();
  let celler='';
  for(let i=0;i<offset;i++)celler+='<div class="dag tom"></div>';
  for(let d=1;d<=dager;d++){
    const ds=toStr(visAar,visMnd,d);
    const alle=[...hendelserPa(ds).map(h=>({...h,_f:farge(h.hvem)})),...eksternePa(ds).map(e=>({...e,_f:EKS_FARGE,_eks:true}))];
    const piller=alle.slice(0,2).map(h=>
      '<span class="hpille'+(h._eks?' eks':'')+'" style="background:'+h._f+'">'+(h.tid?esc(h.tid)+' ':'')+esc(h.tittel)+'</span>').join('');
    const mer=alle.length>2?'<div class="hmer">+'+(alle.length-2)+' til</div>':'';
    celler+='<div class="dag'+(ds===idag?' idag':'')+(ds===valgtDato?' valgt':'')+'" data-dato="'+ds+'">'
      +'<div class="dag-nr">'+d+'</div>'+piller+mer+'</div>';
  }
  document.getElementById('grid').innerHTML=celler;
  if(valgtDato)renderDag();
}

function tidSiden(ts){
  const d=Date.now()-ts;
  if(d<60000)return 'nå nettopp';
  if(d<3600000)return 'for '+Math.round(d/60000)+' min siden';
  if(d<86400000)return 'for '+Math.round(d/3600000)+' t siden';
  return new Date(ts).toLocaleDateString('nb-NO',{day:'numeric',month:'short'});
}
function kommentarBoks(h){
  const rader=[...h.kommentarer].sort((a,b)=>a.ts-b.ts).map(k=>
    '<div class="komm-rad"><b style="color:'+farge(k.fra)+'">'+esc(k.fra)+'</b> '+esc(k.tekst)+'<span class="naar">'+esc(tidSiden(k.ts))+'</span></div>').join('')
    ||'<div class="komm-rad" style="color:var(--text4)">Ingen kommentarer ennå.</div>';
  return '<div class="komm-boks">'+rader
    +'<div class="komm-skriv"><input type="text" id="komm-inp" class="hinput" maxlength="200" placeholder="Skriv en kommentar..." />'
    +'<button class="btn-ghost" style="width:auto;flex:0 0 auto" data-send-komm="'+h.id+'">Send</button></div></div>';
}
function renderDag(){
  const panel=document.getElementById('dagpanel');
  panel.style.display='block';
  const dt=new Date(valgtDato+'T12:00:00');
  document.getElementById('dag-tittel').textContent=
    dt.toLocaleDateString('nb-NO',{weekday:'long',day:'numeric',month:'long'});
  const hs=hendelserPa(valgtDato);
  const egne=hs.map(h=>
    '<div class="hrad"><span class="hprikk" style="background:'+farge(h.hvem)+'"></span>'
    +'<div class="hrad-main"><div class="hrad-tittel">'+(h.tid?esc(h.tid)+' · ':'')+esc(h.tittel)+'</div>'
    +'<div class="hrad-sub">'+(h.hvem?esc(h.hvem):'Hele familien')+(h.notat?' · '+esc(h.notat):'')+'</div></div>'
    +'<button class="icon-btn" data-eksport="'+h.id+'" title="Legg til i din kalender" aria-label="Legg til i din kalender"><i class="ti ti-calendar-plus"></i></button>'
    +'<button class="icon-btn komm-knapp" data-komm="'+h.id+'" title="Kommentarer" aria-label="Kommentarer"><i class="ti ti-message-circle"></i>'+(h.kommentarer.length?'<span class="komm-tall">'+h.kommentarer.length+'</span>':'')+'</button>'
    +'<button class="icon-btn" data-rediger="'+h.id+'" title="Rediger"><i class="ti ti-edit"></i></button>'
    +'<button class="icon-btn danger" data-slett="'+h.id+'" title="Slett"><i class="ti ti-trash"></i></button></div>'
    +(apenKommentar===h.id?kommentarBoks(h):'')
    +(apenEksport===h.id?eksportBoks(h):'')).join('');
  const eks=eksternePa(valgtDato).map(e=>
    '<div class="hrad eks-rad"><span class="hprikk" style="background:'+EKS_FARGE+'"></span>'
    +'<div class="hrad-main"><div class="hrad-tittel">'+(e.tid?esc(e.tid)+' · ':'')+esc(e.tittel)+'</div>'
    +'<div class="hrad-sub"><i class="ti ti-calendar" style="font-size:10px"></i> '+esc(e.kilde)+'</div></div></div>').join('');
  document.getElementById('dag-hendelser').innerHTML=(egne+eks)
    ||'<div class="empty-state" style="padding:.5rem">Ingenting planlagt denne dagen.</div>';
}

// ── Hendelser ──
document.getElementById('grid').addEventListener('click',e=>{
  const c=e.target.closest('[data-dato]');
  if(!c)return;
  valgtDato=c.dataset.dato; redigerId=null; nullstillSkjema();
  render();
  document.getElementById('dagpanel').scrollIntoView({behavior:'smooth',block:'nearest'});
});
document.getElementById('forrige').addEventListener('click',()=>{if(--visMnd<0){visMnd=11;visAar--;}render();});
document.getElementById('neste').addEventListener('click',()=>{if(++visMnd>11){visMnd=0;visAar++;}render();});

function nullstillSkjema(){
  document.getElementById('h-tittel').value='';
  document.getElementById('h-tid').value='';
  document.getElementById('h-hvem').value='';
  document.getElementById('h-notat').value='';
  redigerId=null;
  document.getElementById('h-lagre').textContent='Legg til';
  document.getElementById('h-avbryt').style.display='none';
}

document.getElementById('h-lagre').addEventListener('click',async()=>{
  if(!valgtDato)return;
  const tittel=document.getElementById('h-tittel').value.trim();
  if(!tittel){setStatus('Skriv hva som skjer','err');return;}
  const felt={tittel,tid:document.getElementById('h-tid').value||'',
    hvem:document.getElementById('h-hvem').value||'',
    notat:document.getElementById('h-notat').value.trim()||''};
  if(redigerId){
    const h=data.hendelser.find(x=>x.id===redigerId);
    if(h)Object.assign(h,felt);
  }else{
    data.hendelser.push({id:data.nextId++,dato:valgtDato,...felt});
  }
  nullstillSkjema();
  await save();render();
});
document.getElementById('h-avbryt').addEventListener('click',nullstillSkjema);

async function sendKommentar(id){
  const inp=document.getElementById('komm-inp');
  const tekst=inp?.value.trim();
  if(!tekst)return;
  const h=data.hendelser.find(x=>x.id===id);
  if(!h)return;
  if(!Array.isArray(h.kommentarer))h.kommentarer=[];
  h.kommentarer.push({fra:mittNavn,tekst,ts:Date.now()});
  await save();render();
  setTimeout(()=>document.getElementById('komm-inp')?.focus(),30);
}
document.getElementById('dag-hendelser').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='komm-inp'&&apenKommentar!=null)sendKommentar(apenKommentar);
});
document.getElementById('dag-hendelser').addEventListener('click',async e=>{
  const et=e.target.closest('[data-eksport]');
  if(et){apenEksport=apenEksport===parseInt(et.dataset.eksport)?null:parseInt(et.dataset.eksport);renderDag();return;}
  const ic=e.target.closest('[data-ics]');
  if(ic){const h=data.hendelser.find(x=>x.id===parseInt(ic.dataset.ics));if(h)lastNedIcs(h);return;}
  const kt=e.target.closest('[data-komm]');
  if(kt){apenKommentar=apenKommentar===parseInt(kt.dataset.komm)?null:parseInt(kt.dataset.komm);renderDag();return;}
  const sk=e.target.closest('[data-send-komm]');
  if(sk){await sendKommentar(parseInt(sk.dataset.sendKomm));return;}
  const r=e.target.closest('[data-rediger]');
  if(r){
    const h=data.hendelser.find(x=>x.id===parseInt(r.dataset.rediger));
    if(!h)return;
    redigerId=h.id;
    document.getElementById('h-tittel').value=h.tittel;
    document.getElementById('h-tid').value=h.tid||'';
    document.getElementById('h-hvem').value=h.hvem||'';
    document.getElementById('h-notat').value=h.notat||'';
    document.getElementById('h-lagre').textContent='Lagre endring';
    document.getElementById('h-avbryt').style.display='inline-flex';
    document.getElementById('h-tittel').focus();
    return;
  }
  const s=e.target.closest('[data-slett]');
  if(s){
    if(!confirm('Slette hendelsen?'))return;
    data.hendelser=data.hendelser.filter(x=>x.id!==parseInt(s.dataset.slett));
    if(redigerId===parseInt(s.dataset.slett))nullstillSkjema();
    await save();render();
  }
});

// ── Eksterne kalendere (abonnement) ──
function renderAbonner(){
  document.getElementById('abonner-liste').innerHTML=abonnement.length?abonnement.map(a=>
    '<div class="ab-rad"><div class="navn"><div>'+esc(a.navn||'Uten navn')+'</div><div class="url">'+esc(a.url||'')+'</div></div>'
    +'<button class="hrow-del" data-ab-del="'+esc(String(a.id))+'" title="Fjern">×</button></div>').join('')
    :'<div class="empty-state" style="padding:.5rem">Ingen eksterne kalendere ennå.</div>';
}
async function lagreAbonnement(){
  await dbSet(FAMILIE,'kalender_abonnement',abonnement);
}
document.getElementById('abonner-btn').addEventListener('click',()=>{
  renderAbonner();
  document.getElementById('ab-navn').value='';document.getElementById('ab-url').value='';
  document.getElementById('abonner-modal').style.display='flex';
});
document.getElementById('ab-lukk').addEventListener('click',()=>{document.getElementById('abonner-modal').style.display='none';});
document.getElementById('abonner-modal').addEventListener('click',e=>{if(e.target.id==='abonner-modal')e.currentTarget.style.display='none';});
document.getElementById('ab-legg').addEventListener('click',async()=>{
  const navn=document.getElementById('ab-navn').value.trim();
  const url=document.getElementById('ab-url').value.trim();
  if(!navn||!url){setStatus('Fyll inn navn og URL','err');return;}
  if(!/^https?:\/\//.test(url)){setStatus('URL-en må starte med http(s)://','err');return;}
  const id=String(Math.max(0,...abonnement.map(a=>parseInt(a.id)||0))+1);
  abonnement.push({id,navn,url});
  try{await lagreAbonnement();setStatus('Lagt til – hendelsene hentes ved neste synk (opptil en time) ✓','ok');}
  catch(e){abonnement.pop();setStatus('Kunne ikke lagre – prøv igjen','err');return;}
  renderAbonner();
});
document.getElementById('abonner-liste').addEventListener('click',async e=>{
  const d=e.target.closest('[data-ab-del]');
  if(!d)return;
  if(!confirm('Fjerne denne eksterne kalenderen?'))return;
  const id=d.dataset.abDel;
  const forr=abonnement;
  abonnement=abonnement.filter(a=>String(a.id)!==id);
  try{await lagreAbonnement();}catch(e){abonnement=forr;setStatus('Kunne ikke lagre – prøv igjen','err');return;}
  flatUtEksterne(eksMapCache); // re-flat fra gjenværende abonnement
  renderAbonner();render();
  setStatus('Fjernet ✓','ok');
});

load();
</script>
