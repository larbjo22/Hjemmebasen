<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e5d4f">
<link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Nytt i Hjemmebasen</title>
<link rel="stylesheet" href="felles/stil.css">
<style>
.tilbake{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:7px 14px;border-radius:18px;background:var(--accent);color:#fff;text-decoration:none;margin-bottom:12px}
.utgave{margin-bottom:22px}
.utgave-hode{margin:4px 2px 12px}
.utgave-dato{font-size:11.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.utgave-tittel{font-size:19px;font-weight:800;line-height:1.25;margin:3px 0 6px}
.utgave-ingress{font-size:13.5px;line-height:1.55;color:var(--text2);margin:0}
.ny-merke{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:9px;background:var(--accent-bg);border:1px solid var(--accent-border);color:var(--accent-text);vertical-align:middle;margin-left:6px;text-transform:none;letter-spacing:0}
.del .card-title i{font-size:15px;color:var(--accent-text)}
.del ul{margin:0;padding-left:18px}
.del li{font-size:13.5px;line-height:1.55;margin-bottom:7px}
.del li:last-child{margin-bottom:0}
.del li b{font-weight:650}
.fot{font-size:12px;color:var(--text3);text-align:center;margin:8px 0 24px}
@media(min-width:700px){.fw{max-width:600px}}
</style>
<link rel="stylesheet" href="felles/gran.css">
</head>
<body>
<div class="fw">
  <div class="top-bar">
    <h1 class="app-title"><i class="ti ti-sparkles"></i> Nytt i Hjemmebasen</h1>
    <div class="top-right">
      <button class="icon-btn" id="theme-btn"></button>
    </div>
  </div>
  <a class="tilbake" href="hjem.html"><i class="ti ti-home"></i> Hjem</a>
  <div id="utgaver"></div>
  <p class="fot">Har du forslag eller fant du en feil? Si fra til den som inviterte deg.</p>
</div>

<script type="module">
import { esc, initTheme, toggleTheme } from './felles/ui.js';
import { NYHETER, nyheterUlest, markerNyheterLest } from './felles/nyheter.js';

initTheme();
document.getElementById('theme-btn').addEventListener('click', toggleTheme);

const varUlest = nyheterUlest();

function datoTxt(ds) {
  const d = new Date(ds + 'T12:00:00');
  return d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' });
}

// Punktene i nyheter.js er vår egen, faste tekst med <b> for utheving –
// de settes inn som HTML. Alt annet går gjennom esc().
document.getElementById('utgaver').innerHTML = NYHETER.map((u, i) =>
  '<section class="utgave">'
  + '<div class="utgave-hode">'
  + '<div class="utgave-dato">' + esc(datoTxt(u.dato)) + (i === 0 && varUlest ? '<span class="ny-merke">Nytt</span>' : '') + '</div>'
  + '<h2 class="utgave-tittel">' + esc(u.tittel) + '</h2>'
  + (u.ingress ? '<p class="utgave-ingress">' + esc(u.ingress) + '</p>' : '')
  + '</div>'
  + u.deler.map(d =>
      '<div class="card del">'
      + '<div class="card-title"><i class="ti ' + esc(d.ikon) + '"></i> ' + esc(d.navn) + '</div>'
      + '<ul>' + d.punkter.map(p => '<li>' + p + '</li>').join('') + '</ul>'
      + '</div>').join('')
  + '</section>').join('');

markerNyheterLest();
</script>
</body>
</html>
